# Golden query set for the `fixture` source.
#
# kind = "semantic" -> query shares NO significant content words with the target.
# kind = "lexical"  -> exact term / identifier / error string.
# kind = "hybrid"   -> needs both halves to rank correctly.
#
# `relevant` lists rel_paths (relative to eval/fixture/) that genuinely answer the
# query. A hit counts as relevant if its rel_path is in this list.
#
# ---------------------------------------------------------------------------
# A note on why this set looks the way it does.
#
# The first time we measured retrieval, 25 of these 40 queries scored a perfect
# 1.000 on every arm. A query that every arm answers perfectly measures nothing:
# it cannot tell dense from lexical from fusion, and an eval built out of them is
# an eval you can only tune against noise.
#
# The cause was structural, not a bug in the queries. Almost every identifier and
# every fact in the corpus appeared in exactly ONE file. With a single candidate
# in the whole index, BM25 cannot be wrong and neither can cosine distance.
#
# So the corpus now carries deliberate distractors: changelogs, cross-references,
# runbooks, registers and "see also" notes that MENTION a term without answering
# the question it belongs to, plus near-miss identifiers (MAX_RETRY_BUDGET_MS
# alongside MAX_RETRY_BUDGET) and documents on the same topic as a semantic
# query's target that do not contain its answer.
#
# The rule for every query below: exactly one file genuinely answers it. The
# distractors are plausible and wrong. Ambiguity here would not make the eval
# harder, it would make it meaningless.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# semantic (15) - the queries grep cannot serve. Deliberately phrased in
# vocabulary the answer does not use; tests/test_golden_set.py enforces this.
# ---------------------------------------------------------------------------

