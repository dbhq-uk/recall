# ---------------------------------------------------------------------------
# hybrid (10) - the queries that justify RRF existing at all.
#
# The shape each one is built to: a rare exact term that now appears in SEVERAL
# corpus files, so the lexical half alone shortlists the wrong ones as readily as
# the right one; plus a conceptual framing that is ambiguous without that term,
# so the dense half alone shortlists neighbours on the same topic. Neither half
# should win alone. Only the intersection lands on the target.
#
# Term multiplicity, at the time of writing (files containing the term):
#   ChromaDB 4 | pg_cron 4 | BullMQ 5 | Sikaflex 4 | Thinsulate 4
#   DPF 4 | "Flat Rate Scheme" 4 | "Tom Vickers" 6 | "risk buffer" 4
#   "Sarpo Mira" 4
#
# If any of these ever drops back to 1, that query has quietly gone saturated
# again and is measuring nothing. Check before trusting the number.
# ---------------------------------------------------------------------------

[[query]]
