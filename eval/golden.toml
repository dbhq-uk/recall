# Golden query set for the `fixture` source.
#
# kind = "semantic" -> query shares NO significant content words with the target.
# kind = "lexical"  -> exact term / identifier / error string.
# kind = "hybrid"   -> needs both halves to rank correctly.
#
# `relevant` lists rel_paths (relative to eval/fixture/) that genuinely answer the
# query. A hit counts as relevant if its rel_path is in this list.

# ---------------------------------------------------------------------------
# semantic (15) - the queries grep cannot serve. Deliberately phrased in
# vocabulary the answer does not use; tests/test_golden_set.py enforces this.
# ---------------------------------------------------------------------------

