# ---------------------------------------------------------------------------
# lexical (15) - an exact identifier, error string, config key or part number.
#
# The term has to matter: strip it out and the query is unanswerable. But a bare
# identifier lookup ("TariffCalculator") cannot discriminate between anything, so
# each of these is a QUESTION that happens to contain the identifier, and each
# identifier now appears in three or four files. The decoys - an on-call error
# catalogue, a changelog, consumer modules that import and catch - mention the
# term without answering the question, so ranking the true answer first takes
# more than raw term-matching.
# ---------------------------------------------------------------------------

