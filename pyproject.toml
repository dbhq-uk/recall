[project]
name = "recall"
version = "0.1.0"
description = "Local-first hybrid retrieval server for coding agents, over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DBHQ Consulting Ltd" }]
dependencies = [
    "mcp>=1.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "httpx>=0.28",
    "typer>=0.15",
    "tomli-w>=1.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.12",
]

[project.scripts]
recall = "recall.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=recall --cov-report=term-missing"
markers = [
    "integration: requires a live Postgres (deselect with '-m \"not integration\"')",
    "ollama: requires a live Ollama with nomic-embed-text pulled",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# eval/fixture is a corpus of deliberately varied-style sample code used to
# exercise the chunker across authors' quirks (see its own commit history) — it
# is fixture data, not code we own the style of. assets/ is generated/build
# tooling for brand artefacts, explicitly out of scope (see CLAUDE.md).
extend-exclude = ["eval/fixture", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: function calls in default arguments are how Typer declares CLI options
# (`typer.Option(...)`) — the whole framework's argument-binding idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["recall"]

[tool.mypy]
python_version = "3.12"
files = ["src/recall"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
# No [[tool.mypy.overrides]] block: every third-party dependency actually used
# by src/recall (psycopg, pgvector, mcp, httpx, typer, tomli_w, tree_sitter,
# tree_sitter_language_pack) ships a py.typed marker or inline stubs, so there
# is no missing-stub module to silence. Add one here, scoped to the specific
# module, if that ever stops being true.
