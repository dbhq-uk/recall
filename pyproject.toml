[project]
name = "recall"
version = "0.1.0"
description = "Local-first hybrid retrieval server for coding agents, over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DBHQ Consulting Ltd" }]
dependencies = [
    "mcp>=1.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "httpx>=0.28",
    "typer>=0.15",
    "tomli-w>=1.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.12",
]

[project.scripts]
recall = "recall.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres (deselect with '-m \"not integration\"')",
    "ollama: requires a live Ollama with nomic-embed-text pulled",
]
